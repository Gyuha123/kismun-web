<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />

<link rel="stylesheet" href="styles.css" />
<script type="speculationrules">
{
  "prerender": [{
    "where": { "and": [
      { "href_matches": "/*.html" },
      { "not": { "href_matches": "/reports/*" } }
    ]},
    "eagerness": "moderate"
  }]
}
</script>
</head>
<body class="board-body">

<main class="board">
  <nav class="seg board-tabs" role="tablist" aria-label="Board view" data-active="vote">
    <button type="button" class="board-tab is-active" role="tab" data-view="vote" aria-selected="true">Vote</button>
    <button type="button" class="board-tab" role="tab" data-view="placard" aria-selected="false">Placard</button>
  </nav>
  <header class="board-head">
    <p class="board-eyebrow">KISMUN 2026 &middot; Vote</p>
    <h1 class="board-topic" id="boardTopic">Waiting for the topic</h1>
    <p class="board-open" id="boardOpen"></p>
  </header>

  <section class="board-tally" aria-label="Summary">
    <div class="tally tally-for"><span class="tally-num" id="nFor">0</span><span class="tally-label">For</span></div>
    <div class="tally tally-against"><span class="tally-num" id="nAgainst">0</span><span class="tally-label">Against</span></div>
    <div class="tally tally-abstain"><span class="tally-num" id="nAbstain">0</span><span class="tally-label">Abstain</span></div>
    <div class="tally tally-none"><span class="tally-num" id="nNone">0</span><span class="tally-label">Not voted</span></div>
  </section>

  <section class="board-grid" id="boardGrid" aria-label="Delegations"></section>
  <p class="board-note" id="boardNote"></p>
</main>

<script src="allocation-data.js"></script>
<script src="vote-data.js"></script>
<script src="board.js"></script>
</body>
</html>
