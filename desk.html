<header class="pagehero">
  <div class="pagehero-inner">
    <p class="pagehero-eyebrow">KISMUN 2026 &middot; Desk</p>
    <h1 class="pagehero-title">Vote desk</h1>
  </div>
</header>

<main class="pa-page">

  <section class="pa-gate" id="paGate">
    <form id="paForm" autocomplete="off">
      <label class="pa-label" for="paPass">Password</label>
      <div class="pa-row">
        <input id="paPass" class="pa-input" type="password" required />
        <button type="submit" class="pa-btn">Enter</button>
      </div>
      <p class="pa-error" id="paError" aria-live="polite"></p>
    </form>
  </section>

  <section class="pa-panel" id="paPanel" hidden>

    <div class="pa-block">
      <p class="pa-label">Topic</p>
      <form id="topicForm" class="pa-row">
        <input id="topicInput" class="pa-input" type="text" maxlength="200" placeholder="e.g. Resolution 1/2026" />
        <button type="submit" class="pa-btn">Save topic</button>
      </form>
      <p class="pa-error" id="topicNote" aria-live="polite"></p>
    </div>

    <div class="pa-block pa-status">
      <div>
        <p class="pa-label">Voting</p>
        <p class="pa-count" id="voteState">Closed</p>
      </div>
      <div class="pa-actions">
        <button type="button" class="pa-btn" id="openBtn">Open voting</button>
        <button type="button" class="pa-btn pa-btn-ghost" id="closeBtn">Close voting</button>
      </div>
    </div>

    <div class="pa-block">
      <p class="pa-label">Live summary</p>
      <div class="pa-summary">
        <span>For <strong id="sFor">0</strong></span>
        <span>Against <strong id="sAgainst">0</strong></span>
        <span>Abstain <strong id="sAbstain">0</strong></span>
        <span>Not voted <strong id="sNone">0</strong></span>
      </div>
    </div>

    <div class="pa-block">
      <p class="pa-label">Delegations</p>
      <ul class="pa-list" id="paList"></ul>
    </div>

    <div class="pa-block pa-danger">
      <p class="pa-label">Maintenance</p>
      <div class="pa-actions">
        <button type="button" class="pa-btn pa-btn-ghost" id="resetBtn">All clear (reset votes)</button>
        <button type="button" class="pa-btn pa-btn-ghost" id="unblockBtn">Unblock all networks</button>
      </div>
      <p class="pa-error" id="paNote" aria-live="polite"></p>
    </div>

  </section>

</main>
