[build]
  publish = "."

[build.processing]
  skip_processing = true

[build.processing.css]
  bundle = false
  minify = false

[build.processing.js]
  bundle = false
  minify = false

[build.processing.html]
  pretty_urls = false

[build.processing.images]
  compress = false

# The desk is part of the board page now
[[redirects]]
  from = "/desk.html"
  to = "/board.html"
  status = 301
  force = true

# Live reads: this site's own /live/... is passed straight to the database's REST
# address. A proxy costs no function calls, and browsers only ever talk to this
# site, so it works on networks that block the database host. Only the two public
# trees are passed on, and the database rules keep them read-only.
[[redirects]]
  from = "/live/session/*"
  to = "https://kismun-placard-default-rtdb.asia-southeast1.firebasedatabase.app/session/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/live/votes/*"
  to = "https://kismun-placard-default-rtdb.asia-southeast1.firebasedatabase.app/votes/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/live/session.json"
  to = "https://kismun-placard-default-rtdb.asia-southeast1.firebasedatabase.app/session.json"
  status = 200
  force = true

[[redirects]]
  from = "/live/votes.json"
  to = "https://kismun-placard-default-rtdb.asia-southeast1.firebasedatabase.app/votes.json"
  status = 200
  force = true

# Security headers for every page and file
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
